:root{
  --ink:#1f1b18; --ink2:#5c534b; --paper:#fbf8f3; --paper2:#f1ebe1; --line:#ded5c7;
  --accent:#8c2a1f; --shadow:0 6px 24px rgba(40,25,10,.18);
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --panel-w:430px; --side-w:310px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid #1d6fd1;outline-offset:2px}

/* ---------- header ---------- */
#top{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--paper);border-bottom:1px solid var(--line);z-index:1200;position:relative}
#top h1{font-family:var(--serif);font-size:1.25rem;margin:0;letter-spacing:.2px;line-height:1.1}
#top h1 small{display:block;font-family:var(--sans);font-size:.72rem;font-weight:400;color:var(--ink2);letter-spacing:.3px;margin-top:2px}
#top .sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-size:.85rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--paper2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#6f1f16}
.btn.icon{padding:7px 10px}

/* ---------- stage ---------- */
#stage{flex:1 1 auto;position:relative;min-height:0}
#map{position:absolute;inset:0;background:#d8e2e6}
.leaflet-container{font-family:var(--sans)}
body.detail-open .leaflet-right{right:var(--panel-w)}
.leaflet-right,.leaflet-left{transition:right .25s,left .25s}

/* ---------- side panel ---------- */
#side{position:absolute;top:10px;left:10px;bottom:10px;width:var(--side-w);background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:1100;display:flex;flex-direction:column;transition:transform .25s}
body.side-closed #side{transform:translateX(calc(-100% - 20px))}
#side .head{padding:12px 12px 8px;border-bottom:1px solid var(--line)}
#search{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 9px 3px 3px;font-size:.74rem;line-height:1.2}
.chip .mini{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--c)}
.chip .mini svg{width:13px;height:13px}
.chip .mini .glyph{font-size:12px;color:#fff;line-height:1}
.chip[aria-pressed="false"]{opacity:.45;background:var(--paper2)}
.chip .n{color:var(--ink2)}
.row2{display:flex;gap:8px;margin-top:10px;align-items:center;font-size:.78rem;color:var(--ink2)}
.row2 select{flex:1;padding:5px;border:1px solid var(--line);border-radius:6px;background:#fff;font:inherit}
#count{padding:6px 12px;font-size:.76rem;color:var(--ink2);border-bottom:1px solid var(--line)}
#list{list-style:none;margin:0;padding:4px;overflow:auto;flex:1}
#list li{margin:0}
#list button{width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 8px;display:flex;gap:9px;align-items:center}
#list button:hover,#list button.on{background:var(--paper2)}
#list .mini{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--c)}
#list .mini svg{width:16px;height:16px}
#list .mini .glyph{font-size:15px;color:#fff;line-height:1}
#list .t{font-size:.84rem;line-height:1.25}
#list .t b{font-weight:600;display:block}
#list .t span{color:var(--ink2);font-size:.74rem}
#list li.off button{opacity:.38}

#sideToggle{position:absolute;top:18px;left:18px;z-index:1090;display:none}
body.side-closed #sideToggle{display:inline-flex}

/* ---------- pins ---------- */
.pin-wrap{background:none;border:0}
.pin{position:relative;width:44px;height:52px;transform:translate(var(--dx,0px),var(--dy,0px)) scale(var(--s,1));transform-origin:22px 50px;transition:transform .35s ease,opacity .3s,filter .3s}
.pin .leader{position:absolute;left:0;top:0;width:44px;height:52px;overflow:visible;pointer-events:none}
.pin .leader line{stroke:var(--c);stroke-width:2;stroke-dasharray:3 3;opacity:.8}
.pin .leader circle{fill:var(--c);stroke:#fff;stroke-width:1.5}
.pin .float{position:absolute;inset:0;animation:bob 3.2s ease-in-out infinite;animation-delay:var(--d,0s)}
.pin .badge{position:absolute;left:3px;top:0;width:38px;height:38px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35);display:grid;place-items:center;transition:transform .15s}
.pin .tail{position:absolute;left:15px;top:35px;width:14px;height:14px;background:var(--c);transform:rotate(45deg);border-right:3px solid #fff;border-bottom:3px solid #fff;border-radius:0 0 4px 0;box-shadow:3px 3px 6px rgba(0,0,0,.2);z-index:-1}
.pin .badge svg{width:22px;height:22px}
.pin .badge .glyph{font-size:21px;color:#fff;line-height:1;margin-top:-1px}
.pin.live .badge::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--c);animation:ring 2.2s ease-out infinite;opacity:0}
.pin-wrap:hover .badge,.pin-wrap:focus .badge{transform:scale(1.18)}
.pin.sel .badge{transform:scale(1.28);box-shadow:0 0 0 4px rgba(255,255,255,.9),0 6px 14px rgba(0,0,0,.45)}
.pin.dim{opacity:.22;filter:grayscale(1)}
.pin-wrap:focus{outline:none}
.pin-wrap:focus-visible .badge{outline:3px solid #1d6fd1;outline-offset:2px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes ring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.pin .float,.pin.live .badge::after{animation:none}}
.leaflet-tooltip.tip{font-family:var(--sans);font-size:.8rem;border:0;border-radius:8px;box-shadow:var(--shadow);padding:6px 9px;color:var(--ink)}
.leaflet-tooltip.tip b{display:block;font-family:var(--serif);font-size:.9rem}

/* ---------- detail ---------- */
#detail{position:absolute;top:10px;right:10px;bottom:10px;width:var(--panel-w);max-width:calc(100% - 20px);background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:1150;display:flex;flex-direction:column;transform:translateX(calc(100% + 24px));transition:transform .28s ease}
body.detail-open #detail{transform:none}
#detail .bar{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--paper2);border-radius:12px 12px 0 0}
#detail .bar .sp{flex:1}
#detail .scroll{overflow:auto;padding:16px 18px 22px;flex:1}
.hero{display:flex;gap:12px;align-items:flex-start}
.hero .big{flex:0 0 auto;width:54px;height:54px;border-radius:50%;background:var(--c);display:grid;place-items:center;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.hero .big svg{width:32px;height:32px}
.hero .big .glyph{font-size:31px;color:#fff;line-height:1}
.hero h2{font-family:var(--serif);font-size:1.4rem;line-height:1.15;margin:0}
.hero .sub{color:var(--ink2);font-size:.85rem;margin-top:3px}
.tag{display:inline-block;font-size:.7rem;border-radius:999px;padding:2px 8px;background:var(--c);color:#fff;margin-right:4px;vertical-align:middle}
.tag.live{background:#1b1b1b}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.fact{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.fact .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.6px;color:var(--ink2)}
.fact .v{font-size:.92rem;font-weight:600;margin-top:2px;line-height:1.25}
.fact.wide{grid-column:1/3}
.meter{display:flex;gap:3px;margin-top:6px}
.meter i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.meter i.on{background:var(--c)}
#detail h3{font-family:var(--serif);font-size:1rem;margin:18px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--c)}
#detail p{margin:0 0 8px;line-height:1.5;font-size:.92rem}
#detail ul.leaders{margin:0;padding-left:18px;font-size:.9rem;line-height:1.45}
#detail ul.leaders li{margin:3px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.two .card h4{margin:0 0 4px;font-size:.72rem;text-transform:uppercase;letter-spacing:.6px;color:var(--ink2)}
.two .card p{font-size:.84rem;margin:0}
ol.tl{list-style:none;margin:0;padding:0 0 0 8px;border-left:2px solid var(--line)}
ol.tl li{position:relative;padding:0 0 10px 16px;font-size:.88rem;line-height:1.4}
ol.tl li::before{content:"";position:absolute;left:-7px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--c);border:2px solid var(--paper)}
ol.tl b{font-variant-numeric:tabular-nums;margin-right:6px;color:var(--c)}
.note{font-size:.74rem;color:var(--ink2);margin-top:16px;line-height:1.4;border-top:1px dashed var(--line);padding-top:10px}
.read{font-size:.84rem;color:var(--ink2);font-style:italic}

/* ---------- timeline ---------- */
#timeline{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 16px 6px;background:var(--paper);border-top:1px solid var(--line);z-index:1200;position:relative}
#timeline .yr{font-family:var(--serif);font-size:1.5rem;min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
#timeline .mid{flex:1;min-width:0}
#timeline input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.ticks{display:flex;justify-content:space-between;font-size:.66rem;color:var(--ink2);padding:0 2px}
#yearInfo{font-size:.78rem;color:var(--ink2);white-space:nowrap;min-width:175px}

/* ---------- tour bar ---------- */
#tour{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:1160;background:var(--ink);color:#fff;border-radius:999px;padding:6px 8px;display:none;align-items:center;gap:8px;box-shadow:var(--shadow);font-size:.85rem}
body.touring #tour{display:flex}
body.touring #side{transform:translateX(calc(-100% - 20px))}
#tour button{background:rgba(255,255,255,.14);border:0;border-radius:999px;color:#fff;padding:5px 12px}
#tour button:hover{background:rgba(255,255,255,.28)}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(20,12,5,.55);z-index:3000;display:none;align-items:center;justify-content:center;padding:18px}
#modal.open{display:flex}
#modal .box{background:var(--paper);border-radius:14px;max-width:980px;width:100%;max-height:92vh;overflow:auto;box-shadow:var(--shadow);padding:20px 24px;position:relative}
#modal h2{font-family:var(--serif);margin:0 0 10px}
#modal .x{position:absolute;right:12px;top:10px}
#modal h3{font-family:var(--serif);margin:18px 0 6px}
#modal p,#modal li{font-size:.92rem;line-height:1.5}
table.cmp{border-collapse:collapse;width:100%;font-size:.82rem}
table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
table.cmp th{position:sticky;top:-20px;background:var(--paper);cursor:pointer;user-select:none;white-space:nowrap}
table.cmp th:hover{color:var(--accent)}
table.cmp tr.r{cursor:pointer}
table.cmp tr.r:hover{background:var(--paper2)}
table.cmp td.num{text-align:right;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px}

#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:.84rem;z-index:3500;opacity:0;pointer-events:none;transition:opacity .3s;max-width:90vw;text-align:center}
#toast.show{opacity:1}

/* ---------- mobile ---------- */
@media (max-width:760px){
  :root{--panel-w:100%}
  #top{padding:6px 10px;gap:6px;flex-wrap:nowrap}
  #top h1{font-size:.95rem}
  #top h1 small{display:none}
  .btn{padding:6px 8px;font-size:.74rem}
  .ticks span:nth-child(even){display:none}
  .pin{--s:.74}
  #side{top:0;left:0;bottom:0;width:100%;max-width:none;border-radius:0}
  #detail{top:auto;left:0;right:0;bottom:0;width:100%;max-width:none;height:72%;border-radius:14px 14px 0 0}
  body.detail-open .leaflet-right{right:0}
  #timeline{gap:8px;padding:6px 10px}
  #timeline .yr{font-size:1.15rem;min-width:52px}
  #yearInfo{display:none}
  .two,.facts{grid-template-columns:1fr}
  .fact.wide{grid-column:auto}
}

/* ---------- print: só a ficha do regime ---------- */
@media print{
  body{overflow:visible;display:block;background:#fff}
  #top,#side,#sideToggle,#map,#timeline,#tour,#modal,#toast,#detail .bar{display:none!important}
  #stage{position:static}
  #detail{position:static;transform:none;width:auto;max-width:none;border:0;box-shadow:none;display:block}
  #detail .scroll{overflow:visible;padding:0}
}

</style>
</head>
<body>

<header id="top">
  <h1>Atlas das Ditaduras<small>Regimes autoritários e totalitários desde 1900 · mapa interativo para estudos de caso</small></h1>
  <span class="sp"></span>
  <button class="btn primary" id="tourBtn" type="button" title="Percorrer os regimes em ordem cronológica">▶ Apresentar</button>
  <button class="btn" id="tableBtn" type="button">Tabela</button>
  <button class="btn" id="aboutBtn" type="button">Sobre</button>
</header>

<div id="stage">
  <div id="map" role="application" aria-label="Mapa-múndi com os regimes ditatoriais"></div>

  <button class="btn" id="sideToggle" type="button">☰ Lista e filtros</button>

  <aside id="side" aria-label="Lista e filtros">
    <div class="head">
      <input id="search" type="search" placeholder="Buscar regime, país ou líder…" aria-label="Buscar">
      <div class="legend" id="legend"></div>
      <div class="row2">
        <select id="band" aria-label="Filtrar por faixa de mortes"></select>
        <button class="btn" id="legendAll" type="button" title="Marcar ou desmarcar todos os tipos">Todos</button>
        <button class="btn icon" id="sideClose" type="button" aria-label="Recolher painel">«</button>
      </div>
    </div>
    <div id="count"></div>
    <ul id="list"></ul>
  </aside>

  <div id="tour">
    <button id="tourPrev" type="button" aria-label="Anterior">◀</button>
    <span id="tourPos">–</span>
    <button id="tourNext" type="button" aria-label="Próximo">▶</button>
    <button id="tourExit" type="button">Sair</button>
  </div>

  <section id="detail" aria-label="Ficha do regime" aria-live="polite">
    <div class="bar">
      <button class="btn icon" id="prev" type="button" aria-label="Regime anterior">◀</button>
      <button class="btn icon" id="next" type="button" aria-label="Próximo regime">▶</button>
      <span class="sp"></span>
      <button class="btn" id="linkBtn" type="button">Copiar link</button>
      <button class="btn" id="printBtn" type="button">Imprimir</button>
      <button class="btn icon" id="closeDetail" type="button" aria-label="Fechar ficha">✕</button>
    </div>
    <div class="scroll" id="detailBody"></div>
  </section>
</div>

<footer id="timeline">
  <button class="btn icon" id="play" type="button" aria-label="Reproduzir linha do tempo">▶</button>
  <div class="yr" id="yearOut">Todos</div>
  <div class="mid">
    <input id="year" type="range" min="1900" max="2026" step="1" value="2026" aria-label="Ano">
    <div class="ticks" id="ticks"></div>
  </div>
  <button class="btn" id="allYears" type="button">Todos os anos</button>
  <div id="yearInfo"></div>
</footer>

<div id="modal" role="dialog" aria-modal="true" aria-label="Informações">
  <div class="box"><button class="btn icon x" type="button" aria-label="Fechar">✕</button><div id="modalBody"></div></div>
</div>
<div id="toast" role="status"></div>

<script>
(function () {

var NOW = 2026;

/* ------------------------------------------------------------------ *

var TIPOS = {

  fascista:     { nome: 'Fascista / nazista',                           curto: 'Fascista',    cor: '#44403c' },

  autoritario:  { nome: 'Autoritário conservador / partido único',      curto: 'Autoritário', cor: '#1d6aa5' },
  teocratico:   { nome: 'Teocrático / islamista',                       curto: 'Teocrático',  cor: '#1a8059' },
  colonial:     { nome: 'Colonial / segregacionista',                   curto: 'Colonial',    cor: '#c2650e' }
};
Object.keys(TIPOS).forEach(function (k) { TIPOS[k].icon = ICONS[k]; });

var BANDS = [
  { k: 'nd',  t: 'Sem total consolidado', lv: 0 },
  { k: 'b1',  t: 'Menos de 1 mil',        lv: 1 },
  { k: 'b2',  t: '1 mil a 10 mil',        lv: 2 },
  { k: 'b3',  t: '10 mil a 100 mil',      lv: 3 },
  { k: 'b4',  t: '100 mil a 1 milhão',    lv: 4 },
  { k: 'b5',  t: 'Mais de 1 milhão',      lv: 5 }
];
function bandOf(m) {
  if (m == null) return BANDS[0];
  if (m < 1e3) return BANDS[1];
  if (m < 1e4) return BANDS[2];
  if (m < 1e5) return BANDS[3];
  if (m < 1e6) return BANDS[4];

}

/* ------------------------------ utilidades ------------------------------ */
function $(s, el) { return (el || document).querySelector(s); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function dur(r) { return (r.fim == null ? NOW : r.fim) - r.ini; }
function active(r, y) { return r.ini <= y && y <= (r.fim == null ? NOW : r.fim); }
function byId(id) { for (var i = 0; i < DATA.length; i++) if (DATA[i].id === id) return DATA[i]; return null; }
var toastTimer;
function toast(msg, ms) {
  var t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, ms || 3500);

/* --------------------------------- estado -------------------------------- */
var state = { types: {}, band: 'all', q: '', year: null, sel: null, tour: null, playing: null };
Object.keys(TIPOS).forEach(function (k) { state.types[k] = true; });

var markers = {};   // id -> L.marker

/* ---------------------------------- mapa --------------------------------- */
var small = window.innerWidth <= 760;
var map = L.map('map', {
  zoomControl: false, attributionControl: false,
  minZoom: small ? 1 : 2, maxZoom: 12, zoomSnap: 0.5, zoomDelta: 0.5,
  maxBounds: [[-85, -200], [85, 200]], maxBoundsViscosity: 0.9, worldCopyJump: false
});
var SIDE_W = 330;
function homeView(animate) {
  map.fitBounds([[-42, -100], [64, 148]], {
    paddingTopLeft: [small ? 10 : SIDE_W, 10], paddingBottomRight: [10, 10], animate: !!animate
  });
}
if (small) document.body.classList.add('side-closed');
homeView(false);
L.control.zoom({ position: 'bottomright', zoomInTitle: 'Aproximar', zoomOutTitle: 'Afastar' }).addTo(map);

/* Mapa-múndi vetorial embutido: garante um mapa legível mesmo sem internet ou se o serviço de tiles sair do ar. */
function unwrapRing(ring) {           // remove saltos de 360° no meridiano 180 (Rússia, Fiji)
  var off = 0, out = [];
  for (var i = 0; i < ring.length; i++) {
    if (i > 0) { var d = ring[i][0] - ring[i - 1][0]; if (d > 180) off -= 360; else if (d < -180) off += 360; }
    out.push([ring[i][0] + off, ring[i][1]]);
  }
  return out;
}
function shiftRings(rings, dx) { return rings.map(function (r) { return r.map(function (p) { return [p[0] + dx, p[1]]; }); }); }
function worldFeature(geo) {
  var out = [];
  geo.features.forEach(function (ft) {
    if (ft.properties && ft.properties.name === 'Antarctica') return;
    var polys = ft.geometry.type === 'Polygon' ? [ft.geometry.coordinates] : ft.geometry.coordinates;
    polys.forEach(function (poly) {
      var rings = poly.map(unwrapRing), mn = Infinity, mx = -Infinity;
      rings[0].forEach(function (p) { mn = Math.min(mn, p[0]); mx = Math.max(mx, p[0]); });
      out.push(rings);
      if (mn < -180) out.push(shiftRings(rings, 360));
      if (mx > 180) out.push(shiftRings(rings, -360));
    });
  });
  return { type: 'Feature', properties: {}, geometry: { type: 'MultiPolygon', coordinates: out } };
}
if (window.WORLD && window.topojson) {
  map.createPane('land'); map.getPane('land').style.zIndex = 190;
  L.geoJSON(worldFeature(topojson.feature(window.WORLD, window.WORLD.objects.countries)), {
    pane: 'land', interactive: false,
    style: { fillColor: '#efe9dd', fillOpacity: 1, color: '#b7ae9d', weight: 0.7 }
  }).addTo(map);
}
L.control.attribution({ prefix: false }).addAttribution(
  '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a> | <a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>'
).addTo(map);

var tileErrors = 0;
var tiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd', maxZoom: 12, noWrap: true, detectRetina: false
}).addTo(map);
tiles.on('tileerror', function () {
  tileErrors++;
  if (tileErrors === 8) toast('Não foi possível carregar o mapa-base (sem internet?). Os ícones e as fichas continuam funcionando.', 6000);
});

/* ------------------------------ ícones flutuantes ----------------------------- */
function pinHtml(r, i) {
  var t = TIPOS[r.tipo];
  return '<div class="pin' + (r.fim == null ? ' live' : '') + '" style="--c:' + t.cor + ';--d:' + ((i % 7) * -0.45).toFixed(2) + 's">' +
    '<svg class="leader" aria-hidden="true"><line x1="22" y1="50" x2="22" y2="50"/><circle cx="22" cy="50" r="0"/></svg>' +
    '<div class="float"><div class="tail"></div><div class="badge">' + t.icon + '</div></div></div>';
}
DATA.forEach(function (r, i) {
  var t = TIPOS[r.tipo];
  var m = L.marker([r.lat, r.lng], {
    icon: L.divIcon({ className: 'pin-wrap', html: pinHtml(r, i), iconSize: [44, 52], iconAnchor: [22, 50] }),
    title: r.nome + ' (' + r.periodo + ')', alt: r.nome, keyboard: true, riseOnHover: true
  });
  m.bindTooltip('<b>' + esc(r.nome) + '</b>' + esc(r.pais) + ' · ' + esc(r.ini + (r.fim == null ? '–hoje' : '–' + r.fim)),
    { direction: 'top', offset: [0, -48], className: 'tip', opacity: 1 });
  m.on('click', function () { openRegime(r.id, { fly: false }); });
  markers[r.id] = m;
});

/* Separa visualmente ícones que se sobrepõem na tela (vários regimes no mesmo lugar). */
function relax() {
  var D = small ? 28 : 38, pts = [];
  visible.forEach(function (r) {
    var m = markers[r.id];
    if (!m.getElement()) return;
    var p = map.latLngToLayerPoint(m.getLatLng());
    pts.push({ r: r, x: p.x, y: p.y, ox: 0, oy: 0 });
  });
  var it, i, j, a, b, dx, dy, d, push, k;
  for (it = 0; it < 70; it++) {
    for (i = 0; i < pts.length; i++) {
      for (j = i + 1; j < pts.length; j++) {
        a = pts[i]; b = pts[j];
        dx = (a.x + a.ox) - (b.x + b.ox); dy = (a.y + a.oy) - (b.y + b.oy);
        d = Math.sqrt(dx * dx + dy * dy);
        if (d < D) {
          if (d < 0.01) { var ang = (i * 2.399 + j) % 6.283; dx = Math.cos(ang); dy = Math.sin(ang); d = 1; }
          push = (D - d) / 2 / d;
          a.ox += dx * push; a.oy += dy * push; b.ox -= dx * push; b.oy -= dy * push;
        }
      }
    }
    for (k = 0; k < pts.length; k++) { pts[k].ox *= 0.985; pts[k].oy *= 0.985; }
  }
  pts.forEach(function (p) {
    var el = markers[p.r.id].getElement(); if (!el) return;
    var pin = $('.pin', el); if (!pin) return;
    var ox = Math.max(-90, Math.min(90, p.ox)), oy = Math.max(-90, Math.min(90, p.oy));
    if (Math.abs(ox) < 4 && Math.abs(oy) < 4) { ox = 0; oy = 0; }
    pin.style.setProperty('--dx', ox.toFixed(1) + 'px');
    pin.style.setProperty('--dy', oy.toFixed(1) + 'px');
    var ln = $('.leader line', pin), ci = $('.leader circle', pin), off = (ox !== 0 || oy !== 0);
    ln.setAttribute('x2', 22 - ox); ln.setAttribute('y2', 50 - oy);
    ci.setAttribute('cx', 22 - ox); ci.setAttribute('cy', 50 - oy); ci.setAttribute('r', off ? 4 : 0);
    ln.style.display = off ? '' : 'none';
  });
}
map.on('zoomend', relax);
window.addEventListener('resize', function () { setTimeout(relax, 150); });

/* ------------------------------ filtros + lista ------------------------------ */
function passes(r) {
  if (!state.types[r.tipo]) return false;
  if (state.band !== 'all' && bandOf(r.mref).k !== state.band) return false;
  if (state.q) {
    var hay = norm([r.nome, r.pais, r.lideres.join(' '), r.resumo].join(' '));
    if (hay.indexOf(norm(state.q)) < 0) return false;
  }
  return true;
}
function apply() {
  visible = DATA.filter(passes);
  var show = {}; visible.forEach(function (r) { show[r.id] = true; });
  DATA.forEach(function (r) {
    var m = markers[r.id];
    if (show[r.id]) { if (!map.hasLayer(m)) m.addTo(map); } else if (map.hasLayer(m)) map.removeLayer(m);
  });
  paintYear();
  buildList();
  setTimeout(function () { relax(); paintSel(); }, 0);
  var ys = state.year == null ? '' : ' · ' + visible.filter(function (r) { return active(r, state.year); }).length + ' ativos em ' + state.year;
  $('#count').textContent = visible.length + ' de ' + DATA.length + ' regimes' + ys;
}
function paintYear() {
  visible.forEach(function (r) {
    var el = markers[r.id].getElement(); if (!el) return;
    var pin = $('.pin', el); if (!pin) return;
    pin.classList.toggle('dim', state.year != null && !active(r, state.year));
  });
}
function paintSel() {
  DATA.forEach(function (r) {
    var el = markers[r.id].getElement(); if (!el) return;
    var pin = $('.pin', el); if (pin) pin.classList.toggle('sel', state.sel === r.id);
    markers[r.id].setZIndexOffset(state.sel === r.id ? 2000 : 0);
  });
}
function buildList() {
  var ul = $('#list'); ul.innerHTML = '';
  visible.forEach(function (r) {
    var t = TIPOS[r.tipo], li = document.createElement('li');
    if (state.year != null && !active(r, state.year)) li.className = 'off';
    li.innerHTML = '<button type="button" data-id="' + r.id + '" style="--c:' + t.cor + '"' + (state.sel === r.id ? ' class="on"' : '') + '>' +
      '<span class="mini">' + t.icon + '</span><span class="t"><b>' + esc(r.nome) + '</b><span>' + esc(r.pais) + ' · ' + esc(r.ini + (r.fim == null ? '–hoje' : '–' + r.fim)) + '</span></span></button>';
    ul.appendChild(li);
  });
}
function buildLegend() {
  var box = $('#legend'); box.innerHTML = '';
  Object.keys(TIPOS).forEach(function (k) {
    var t = TIPOS[k], n = DATA.filter(function (r) { return r.tipo === k; }).length;
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.setAttribute('aria-pressed', 'true'); b.dataset.k = k;
    b.title = t.nome + ' — clique para mostrar/ocultar';
    b.style.setProperty('--c', t.cor);
    b.innerHTML = '<span class="mini">' + t.icon + '</span>' + esc(t.curto) + ' <span class="n">' + n + '</span>';
    box.appendChild(b);
  });
}

/* ------------------------------ ficha do regime ------------------------------ */
function detailHtml(r) {
  var t = TIPOS[r.tipo], b = bandOf(r.mref), d = dur(r), h = '';
  h += '<div class="hero"><div class="big">' + t.icon + '</div><div><h2>' + esc(r.nome) + '</h2><div class="sub">' + esc(r.pais) + '</div>' +
       '<div style="margin-top:6px"><span class="tag">' + esc(t.curto) + '</span>' + (r.fim == null ? '<span class="tag live">Em curso</span>' : '') + '</div></div></div>';
  h += '<div class="facts">' +
    '<div class="fact"><div class="k">Período</div><div class="v">' + esc(r.periodo) + '</div></div>' +
    '<div class="fact"><div class="k">Duração</div><div class="v">' + d + ' anos' + (r.fim == null ? ' (até ' + NOW + ')' : '') + '</div></div>' +
    '<div class="fact wide"><div class="k">Mortes — ordem de grandeza</div><div class="v">' + esc(b.t) + '</div><div class="meter" aria-hidden="true">' +
      [1, 2, 3, 4, 5].map(function (n) { return '<i class="' + (n <= b.lv ? 'on' : '') + '"></i>'; }).join('') + '</div></div>' +
    '</div>';
  h += '<h3>Em uma frase</h3><p>' + esc(r.resumo) + '</p>';
  h += '<h3>Líderes e pessoas-chave</h3><ul class="leaders">' + r.lideres.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
  h += '<h3>Mortes e repressão</h3><p>' + esc(r.mortes) + '</p>';
  h += '<div class="two" style="margin-top:12px"><div class="card"><h4>Como começou</h4><p>' + esc(r.comeco) + '</p></div>' +
       '<div class="card"><h4>Como terminou</h4><p>' + esc(r.terminou) + '</p></div></div>';
  h += '<h3>Linha do tempo</h3><ol class="tl">' + r.fatos.map(function (f) { return '<li><b>' + esc(f[0]) + '</b>' + esc(f[1]) + '</li>'; }).join('') + '</ol>';
  h += '<h3>Justiça, memória e legado</h3><p>' + esc(r.legado) + '</p>';
  if (r.fontes) h += '<p class="read"><b>Para aprofundar:</b> ' + esc(r.fontes) + '</p>';
  h += '<p class="note">Os números de mortes são estimativas e variam conforme a fonte e o critério usado (execuções, fome, guerra). Use-os como ordem de grandeza. A classificação do tipo de regime é uma síntese didática. Regimes «em curso» refletem informações até meados de 2026.</p>';
  return h;
}
function openRegime(id, opts) {
  opts = opts || {};
  var r = byId(id); if (!r) return;
  state.sel = id;
  var panel = $('#detail');
  panel.style.setProperty('--c', TIPOS[r.tipo].cor);
  $('#detailBody').innerHTML = detailHtml(r);
  $('#detailBody').scrollTop = 0;
  document.body.classList.add('detail-open');
  if (opts.fly !== false) flyTo(r);
  paintSel();
  Array.prototype.forEach.call(document.querySelectorAll('#list button'), function (b) {
    b.classList.toggle('on', b.dataset.id === id);
    if (b.dataset.id === id && opts.scrollList !== false) b.scrollIntoView({ block: 'nearest' });
  });
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
  document.title = r.nome + ' — Atlas das Ditaduras';
  if (window.innerWidth <= 760) document.body.classList.add('side-closed');
}
function closeDetail() {
  state.sel = null; document.body.classList.remove('detail-open');
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  document.title = 'Atlas das Ditaduras (1900–' + NOW + ')';
  paintSel();
  Array.prototype.forEach.call(document.querySelectorAll('#list button.on'), function (b) { b.classList.remove('on'); });
}
function flyTo(r) {
  var z = Math.min(Math.max(map.getZoom(), 4.5), 6.5);
  var pt = map.project([r.lat, r.lng], z), size = map.getSize();
  if (window.innerWidth > 760) {
    var left = document.body.classList.contains('side-closed') || state.tour ? 0 : SIDE_W, right = 450;
    pt = pt.add([(right - left) / 2, 0]);   // centraliza o ponto na área livre entre os painéis
  } else pt = pt.add([0, size.y * 0.3]);
  map.flyTo(map.unproject(pt, z), z, { duration: 1.1 });
}
function step(dir) {
  if (!visible.length) return;
  var i = -1; visible.forEach(function (r, k) { if (r.id === state.sel) i = k; });
  i = i < 0 ? (dir > 0 ? 0 : visible.length - 1) : (i + dir + visible.length) % visible.length;
  openRegime(visible[i].id);
  if (state.tour) $('#tourPos').textContent = (i + 1) + ' / ' + visible.length;
}

/* ------------------------------ apresentação ------------------------------ */
function startTour() {
  if (!visible.length) return toast('Nenhum regime nos filtros atuais.');
  state.tour = true; document.body.classList.add('touring');
  homeView(true);
  state.sel = null;
  step(1);
}
function endTour() { state.tour = null; document.body.classList.remove('touring'); }

/* ------------------------------ linha do tempo ------------------------------ */
function setYear(y) {
  state.year = y;
  $('#yearOut').textContent = y == null ? 'Todos' : y;
  $('#year').value = y == null ? NOW : y;
  $('#yearInfo').textContent = y == null ? 'Mostrando todos os períodos' : visible.filter(function (r) { return active(r, y); }).length + ' regimes ativos em ' + y;
  paintYear(); buildList();
  $('#count').textContent = visible.length + ' de ' + DATA.length + ' regimes' + (y == null ? '' : ' · ' + visible.filter(function (r) { return active(r, y); }).length + ' ativos em ' + y);
  if (state.sel) Array.prototype.forEach.call(document.querySelectorAll('#list button'), function (b) { b.classList.toggle('on', b.dataset.id === state.sel); });
}
function stopPlay() {
  if (state.playing) { clearInterval(state.playing); state.playing = null; }
  $('#play').textContent = '▶'; $('#play').setAttribute('aria-label', 'Reproduzir linha do tempo');
}
function play() {
  if (state.playing) return stopPlay();
  var y = (state.year == null || state.year >= NOW) ? 1900 : state.year;
  $('#play').textContent = '❚❚'; $('#play').setAttribute('aria-label', 'Pausar');
  setYear(y);
  state.playing = setInterval(function () {
    y++; if (y > NOW) { stopPlay(); return; }
    setYear(y);
  }, 380);
}

/* ------------------------------ modais ------------------------------ */
function openModal(html) { $('#modalBody').innerHTML = html; $('#modal').classList.add('open'); $('#modal .box').scrollTop = 0; $('#modal .x').focus(); }
function closeModal() { $('#modal').classList.remove('open'); }
var sortKey = 'ini', sortDir = 1;
function tableModal() {
  var cols = [
    ['nome', 'Regime'], ['pais', 'País'], ['tipo', 'Tipo'], ['ini', 'Início'], ['fim', 'Fim'], ['dur', 'Duração (anos)'], ['mref', 'Mortes (faixa)']
  ];
  var rows = DATA.slice().sort(function (a, b) {
    function v(r) { return sortKey === 'dur' ? dur(r) : sortKey === 'fim' ? (r.fim == null ? 9999 : r.fim) : sortKey === 'mref' ? (r.mref == null ? -1 : r.mref) : (typeof r[sortKey] === 'string' ? norm(r[sortKey]) : r[sortKey]); }
    var x = v(a), y = v(b); return (x < y ? -1 : x > y ? 1 : 0) * sortDir;
  });
  var h = '<h2>Tabela comparativa</h2><p>Clique no cabeçalho para ordenar e em uma linha para abrir a ficha no mapa.</p><table class="cmp"><thead><tr>' +
    cols.map(function (c) { return '<th data-k="' + c[0] + '">' + c[1] + (sortKey === c[0] ? (sortDir > 0 ? ' ▲' : ' ▼') : '') + '</th>'; }).join('') + '</tr></thead><tbody>' +
    rows.map(function (r) {
      var t = TIPOS[r.tipo];
      return '<tr class="r" data-id="' + r.id + '" style="--c:' + t.cor + '"><td><span class="dot"></span>' + esc(r.nome) + '</td><td>' + esc(r.pais) + '</td><td>' + esc(t.curto) + '</td>' +
        '<td class="num">' + r.ini + '</td><td class="num">' + (r.fim == null ? 'em curso' : r.fim) + '</td><td class="num">' + dur(r) + '</td><td>' + esc(bandOf(r.mref).t) + '</td></tr>';
    }).join('') + '</tbody></table>';
  openModal(h);
}
function aboutModal() {
  var paises = {}; DATA.forEach(function (r) { paises[r.pais.split(' / ')[0]] = 1; });
  openModal(
    '<h2>Atlas das Ditaduras, 1900–' + NOW + '</h2>' +
    '<p>Material de apoio para estudos de caso: <b>' + DATA.length + ' regimes</b> em ' + Object.keys(paises).length + ' países e 5 continentes, com período, líderes, repressão, início, fim e legado de cada um.</p>' +
    '<h3>Como usar</h3><ul>' +
    '<li><b>Mapa:</b> aproxime com a roda do mouse ou os botões; clique em um ícone para abrir a ficha. Onde há mais de um regime no mesmo lugar, os ícones se separam sozinhos (uma linha tracejada indica o ponto exato).</li>' +
    '<li><b>Linha do tempo:</b> arraste o ano ou use ▶ para ver quais regimes estavam ativos; os demais ficam esmaecidos.</li>' +
    '<li><b>Filtros:</b> por tipo de regime (clique na legenda), por faixa de mortes e por busca de texto.</li>' +
    '<li><b>Apresentar:</b> percorre os regimes em ordem cronológica, com as setas do teclado (← →) e Esc para sair.</li>' +
    '<li><b>Tabela:</b> compara duração e mortes entre todos os casos. A ficha também pode ser impressa (botão «Imprimir»).</li></ul>' +
    '<h3>Roteiro de análise para o estudo de caso</h3><ol>' +
    '<li>Como o regime chegou ao poder: golpe, eleição, revolução, ocupação?</li>' +
    '<li>Quem o apoiou: elites, militares, partido, potências estrangeiras?</li>' +
    '<li>Quais instrumentos de controle usou: polícia política, censura, partido único, propaganda, terror?</li>' +
    '<li>Quem foi perseguido e com qual justificativa?</li>' +
    '<li>Como terminou: derrota militar, revolta, negociação, morte do líder?</li>' +
    '<li>O que veio depois: julgamentos, anistia, comissões da verdade, políticas de memória?</li>' +
    '<li>Que padrões se repetem entre os casos? O que explica a durabilidade ou a queda?</li></ol>' +
    '<h3>Nota metodológica</h3><p>Os números de mortes são <b>estimativas</b> e variam conforme a fonte e o que se conta (execuções, fome, guerra, doenças). Por isso cada ficha traz uma faixa de ordem de grandeza. A classificação de cada regime em um «tipo» é uma síntese didática: muitos regimes combinam traços de mais de um. A seleção não é exaustiva. Regimes «em curso» refletem informações até meados de 2026 e devem ser verificados em fontes atualizadas. Cada ícone representa o <i>tipo</i> de regime, não um símbolo próprio de cada governo.</p>' +
    '<p style="font-size:.8rem;color:#5c534b">Mapa-base © OpenStreetMap e CARTO. Biblioteca Leaflet (BSD-2). Este arquivo é independente: não depende de nenhum serviço de IA para funcionar.</p>'
  );
}

/* ------------------------------ eventos ------------------------------ */
$('#list').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-id]'); if (b) openRegime(b.dataset.id);
});
$('#legend').addEventListener('click', function (e) {
  var b = e.target.closest('.chip'); if (!b) return;
  var k = b.dataset.k, on = b.getAttribute('aria-pressed') !== 'true';
  state.types[k] = on; b.setAttribute('aria-pressed', on ? 'true' : 'false'); apply();
});
$('#legendAll').addEventListener('click', function () {
  var allOn = Object.keys(state.types).every(function (k) { return state.types[k]; });
  Object.keys(state.types).forEach(function (k) { state.types[k] = !allOn; });
  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (c) { c.setAttribute('aria-pressed', allOn ? 'false' : 'true'); });
  apply();
});
$('#search').addEventListener('input', function (e) { state.q = e.target.value.trim(); apply(); });
$('#band').addEventListener('change', function (e) { state.band = e.target.value; apply(); });
$('#year').addEventListener('input', function (e) { stopPlay(); setYear(+e.target.value); });
$('#allYears').addEventListener('click', function () { stopPlay(); setYear(null); });
$('#play').addEventListener('click', play);
$('#closeDetail').addEventListener('click', function () { closeDetail(); });
$('#prev').addEventListener('click', function () { step(-1); });
$('#next').addEventListener('click', function () { step(1); });
$('#printBtn').addEventListener('click', function () { window.print(); });
$('#linkBtn').addEventListener('click', function () {
  var url = location.href;
  if (navigator.clipboard && location.protocol.indexOf('http') === 0) {
    navigator.clipboard.writeText(url).then(function () { toast('Link da ficha copiado.'); }, function () { toast(url, 6000); });
  } else toast('O link direto funciona quando o atlas está publicado em um site.', 5000);
});
$('#sideClose').addEventListener('click', function () { document.body.classList.add('side-closed'); });
$('#sideToggle').addEventListener('click', function () { document.body.classList.remove('side-closed'); });
$('#tourBtn').addEventListener('click', startTour);
$('#tourPrev').addEventListener('click', function () { step(-1); });
$('#tourNext').addEventListener('click', function () { step(1); });
$('#tourExit').addEventListener('click', endTour);
$('#tableBtn').addEventListener('click', tableModal);
$('#aboutBtn').addEventListener('click', aboutModal);
$('#modal').addEventListener('click', function (e) {
  if (e.target === this || e.target.classList.contains('x')) return closeModal();
  var th = e.target.closest('th[data-k]');
  if (th) { var k = th.dataset.k; if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = 1; } var st = $('#modal .box').scrollTop; tableModal(); $('#modal .box').scrollTop = st; return; }
  var tr = e.target.closest('tr.r');
  if (tr) { closeModal(); document.body.classList.remove('side-closed'); openRegime(tr.dataset.id); }
});
document.addEventListener('keydown', function (e) {
  var tag = (e.target.tagName || '').toLowerCase();
  if (e.key === 'Escape') {
    if ($('#modal').classList.contains('open')) closeModal();
    else if (state.tour) endTour();
    else if (document.body.classList.contains('detail-open')) closeDetail();
    return;
  }
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if ($('#modal').classList.contains('open')) return;
  if (e.key === 'ArrowRight' && (state.tour || state.sel)) { e.preventDefault(); step(1); }
  if (e.key === 'ArrowLeft' && (state.tour || state.sel)) { e.preventDefault(); step(-1); }
});
window.addEventListener('hashchange', function () {
  var id = location.hash.slice(1); if (id && id !== state.sel && byId(id)) openRegime(id);
});

/* ------------------------------ início ------------------------------ */
(function init() {
  var sel = $('#band');
  sel.innerHTML = '<option value="all">Todas as faixas de mortes</option>' +
    BANDS.slice(1).map(function (b) { return '<option value="' + b.k + '">' + b.t + '</option>'; }).join('') +
    '<option value="nd">' + BANDS[0].t + '</option>';
  var ticks = $('#ticks'); ticks.innerHTML = '';
  for (var y = 1900; y <= 2020; y += 20) ticks.innerHTML += '<span>' + y + '</span>';
  ticks.innerHTML += '<span>' + NOW + '</span>';
  $('#year').min = 1900; $('#year').max = NOW; $('#year').value = NOW;
  buildLegend();
  document.title = 'Atlas das Ditaduras (1900–' + NOW + ')';
  map.whenReady(function () {
    apply(); setYear(null);
    var id = location.hash.slice(1);
    if (id && byId(id)) setTimeout(function () { openRegime(id); }, 250);
    else if (!small) toast('Clique em um ícone para abrir a ficha de cada regime.', 5000);
  });
})();

})();

</script>
</body>
</html>
